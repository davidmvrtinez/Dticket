<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D-Ticket">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>D-Ticket Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="scanner.js" defer></script>
<script src="zxing-reader.js" defer></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #ffffff; --text: #1a1a1a; --sub: #6e6e73;
    --border: #c7c7cc; --panel: #f7f7f9; --btn: #1a1a1a; --btn-text: #fff;
    --btn2: #e5e5ea; --accent: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --sub: #98989e;
            --border: #48484a; --panel: #2c2c2e; --btn: #f2f2f7; --btn-text: #1a1a1a;
            --btn2: #3a3a3c; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); min-height: 100%;
         padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
         display: flex; flex-direction: column; align-items: center;
         -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  .card { background: var(--card); border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 480px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 16px; }
  h1 { font-size: 24px; letter-spacing: -0.3px; margin-bottom: 4px; }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  .drop { border: 2px dashed var(--border); border-radius: 14px; padding: 40px 16px; text-align: center;
          color: var(--sub); font-size: 16px; cursor: pointer; display: block; min-height: 44px; }
  .drop:active { background: var(--panel); }
  .drop .big { font-size: 34px; display: block; margin-bottom: 8px; }
  input[type=file] { display: none; }
  button { width: 100%; padding: 16px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 600;
           background: var(--btn); color: var(--btn-text); margin-top: 14px; cursor: pointer; min-height: 50px; }
  button:active { opacity: .8; }
  button:disabled { opacity: .4; }
  button.secondary { background: var(--btn2); color: var(--text); }
  #status { font-size: 14px; color: var(--sub); margin-top: 12px; text-align: center; min-height: 18px; }
  #summary { font-size: 14px; line-height: 1.7; margin-top: 12px; display: none;
             background: var(--panel); border-radius: 12px; padding: 14px; }
  #summary b { display: inline-block; min-width: 84px; color: var(--sub); font-weight: 600; }
  .err { color: #ff453a !important; }
  #stickers { display: none; margin-top: 14px; }
  .strow { display: flex; align-items: center; gap: 10px; padding: 8px 0;
           border-bottom: 1px solid var(--border); }
  .strow:last-child { border-bottom: 0; }
  .strow .info { flex: 1; font-size: 13px; line-height: 1.4; min-width: 0; }
  .strow .info small { color: var(--sub); display: block; }
  .strow .thumb { width: 74px; height: 34px; border-radius: 6px; border: 1px dashed var(--border);
                  object-fit: cover; background: var(--panel); flex: none; }
  .strow .camBtn { flex: none; width: auto; min-height: 0; margin: 0; padding: 9px 13px;
                   font-size: 14px; border-radius: 10px; background: var(--btn2); color: var(--text); }
  .sthead { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .stsub { font-size: 12.5px; color: var(--sub); margin-bottom: 6px; }
  #previewWrap { display: none; margin-top: 14px; }
  #previewWrap canvas { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block;
                        background: #fff; margin-bottom: 10px; }
  .spinner { display: none; width: 22px; height: 22px; border: 3px solid var(--btn2);
             border-top-color: var(--accent); border-radius: 50%; margin: 12px auto 0;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---- crop modal ---- */
  #cropModal { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
               flex-direction: column; z-index: 130;
               padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  #cropModal.open { display: flex; }
  #cropTitle { color: #fff; font-size: 15px; font-weight: 600; text-align: center; padding: 6px 0 10px; }
  #cropStage { position: relative; flex: 1; touch-action: none; overflow: hidden; }
  #cropImg { position: absolute; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #cropRect { position: absolute; border: 2px solid #0a84ff; border-radius: 4px;
              box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; }
  #cropHandle { position: absolute; right: -16px; bottom: -16px; width: 32px; height: 32px;
                border-radius: 50%; background: #0a84ff; border: 3px solid #fff; }
  #cropBtns { display: flex; gap: 10px; padding-top: 12px; }
  #cropBtns button { margin: 0; flex: 1; }
  .toprow { display: flex; align-items: flex-start; justify-content: space-between; }
  #gear { flex: none; width: 40px; min-height: 40px; padding: 0; margin: 0; font-size: 20px;
          background: var(--btn2); color: var(--text); border-radius: 12px; }
  .fld { margin-bottom: 10px; }
  .fld label { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 4px; font-weight: 600; }
  .fld input, .fld select, .fld textarea { width: 100%; padding: 11px 12px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--panel); color: var(--text);
        font-size: 16px; font-family: inherit; }
  .fld textarea { min-height: 64px; resize: vertical; }
  .fldrow { display: flex; gap: 8px; }
  .fldrow .fld { flex: 1; }
  #setModal, #manualModal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
        z-index: 90; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top)) 16px 30px; }
  #setModal.open, #manualModal.open { display: block; }
  .sheet { background: var(--card); border-radius: 18px; padding: 22px 18px; max-width: 480px; margin: 0 auto; }
  .sheet h2 { font-size: 19px; margin-bottom: 14px; }
  .mitem { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .mitem .fldrow .fld { margin-bottom: 6px; }
  .mitem .rm { background: none; border: 0; color: #ff453a; font-size: 13px; font-weight: 600;
               padding: 4px 0 0; margin: 0; width: auto; min-height: 0; cursor: pointer; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .chk input { width: auto; }
  #notesWrap { display: none; margin-top: 14px; }
  #startBtns { display: flex; gap: 10px; margin-top: 12px; }
  #startBtns button { margin: 0; }
  /* ---- implant scanner ---- */
  #scanModal { position: fixed; inset: 0; background: #000; z-index: 120; display: none; flex-direction: column;
               padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); color: #fff; }
  #scanModal.open { display: flex; }
  #scanHead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
  #scanHead b { font-size: 17px; }
  #scanVidWrap { position: relative; border-radius: 14px; overflow: hidden; background: #111; height: 46vh; flex: none;
                 border: 3px solid #333; transition: border-color .15s; }
  #scanVid { width: 100%; height: 100%; object-fit: cover; display: block; }
  #scanOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #scanCool { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(48,209,88,.92);
              color: #000; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 20px; display: none; }
  #scanStatus { font-size: 14px; min-height: 38px; padding: 8px 2px; color: #ddd; }
  #scanTools { display: flex; gap: 8px; }
  #scanTools button, #scanHead button { margin: 0; width: auto; min-height: 0; padding: 9px 14px; font-size: 14px;
                 background: #2c2c2e; color: #fff; border-radius: 10px; }
  #scanList { flex: 1; overflow-y: auto; margin-top: 8px; }
  .scit { background: #1c1c1e; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .scit .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .scit .r1 b { font-size: 16px; }
  .scit small { color: #aaa; display: block; margin-top: 2px; }
  .scit .warn { color: #ffd60a; }
  .scit .r2 { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .scit .r2 button { margin: 0; width: auto; min-height: 0; padding: 8px 12px; font-size: 14px; background: #0a84ff; color: #fff; border-radius: 9px; }
  .scit .r2 img { height: 44px; max-width: 120px; border-radius: 6px; background: #fff; object-fit: contain; }
  .scit .r2 .ok { color: #30d158; font-size: 13px; }
  .scit input { width: 100%; margin-top: 6px; padding: 9px 10px; border-radius: 8px; border: 1px solid #48484a;
                background: #2c2c2e; color: #fff; font-size: 16px; }
  .scit .qb { display: flex; align-items: center; gap: 6px; }
  .scit .qb button { margin: 0; width: 30px; min-height: 30px; padding: 0; font-size: 18px; background: #3a3a3c; color: #fff; border-radius: 8px; }
  #scanDone { margin-top: 8px; flex: none; }
</style>
</head>
<body>
<div class="card">
  <div class="toprow">
    <div>
      <h1>D-Ticket Generator</h1>
      <div class="sub">DJO / Enovis Sales Order Form &middot; runs entirely on your device</div>
    </div>
    <button id="gear" title="Settings">&#9881;</button>
  </div>
  <label class="drop" id="drop" for="file"><span class="big">&#128196;</span>Tap to choose the sales order PDF<br><small>(Enovis Surgical / ImplantBase order)</small></label>
  <div id="startBtns"><button class="secondary" id="manualBtn">&#9998; Create d-ticket manually</button></div>
  <input type="file" id="file" accept="application/pdf">
  <div class="spinner" id="spin"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="summary"></div>
  <div id="notesWrap"><div class="fld"><label>Notes (printed on the d-ticket)</label>
    <textarea id="notesBox"></textarea></div>
    <button class="secondary" id="notesApply" style="margin-top:0">Apply notes</button></div>
  <div id="stickers"></div>
  <div id="previewWrap"></div>
  <button id="dl" style="display:none">Save / Share D-Ticket</button>
  <button id="editBtn" class="secondary" style="display:none">&#9998; Edit this d-ticket</button>
  <button id="again" class="secondary" style="display:none">Process another order</button>
</div>

<div id="setModal"><div class="sheet">
  <h2>Settings</h2>
  <div class="fld"><label>Agency Name</label><input id="setAgency"></div>
  <div class="fld"><label>Site Number</label><input id="setSite"></div>
  <div class="fld"><label>Default Sales Rep (used if the order has none)</label><input id="setRep"></div>
  <button id="setSave">Save</button>
  <button class="secondary" id="setCancel">Cancel</button>
</div></div>

<div id="manualModal"><div class="sheet">
  <h2>Manual D-Ticket</h2>
  <div class="fldrow">
    <div class="fld"><label>IB Case #</label><input id="mCase"></div>
    <div class="fld"><label>Surgery Date</label><input id="mDate" type="date"></div>
  </div>
  <div class="fld"><label>Hospital</label><input id="mHosp"></div>
  <div class="fldrow">
    <div class="fld"><label>Hospital Code</label><input id="mCode"></div>
    <div class="fld"><label>PO #</label><input id="mPo"></div>
  </div>
  <div class="fldrow">
    <div class="fld"><label>Surgeon (last name)</label><input id="mSurg" placeholder="e.g. Feiner"></div>
    <div class="fld"><label>Patient last name</label><input id="mPat"></div>
  </div>
  <div class="fldrow">
    <div class="fld"><label>Side</label><select id="mSide"><option value=""></option><option>L</option><option>R</option></select></div>
    <div class="fld"><label>Revision</label><select id="mRev"><option value=""></option><option>Y</option><option>N</option></select></div>
    <div class="fld"><label>Revised DJO</label><select id="mRevP"><option value=""></option><option>Y</option><option>N</option></select></div>
  </div>
  <div class="fld"><label>Notes</label><textarea id="mNotes"></textarea></div>
  <div class="fld"><label>Patient label sticker</label>
    <div class="strow" style="border:0;padding:0">
      <div class="info"><b>Patient sticker</b><small>snap or pick a photo</small></div>
      <img class="thumb" id="mPatThumb" style="display:none">
      <div class="thumb" id="mPatPh"></div>
      <button type="button" class="camBtn" id="mPatBtn">📷 Photo</button>
      <input type="file" id="mPatFile" accept="image/*" style="display:none">
    </div>
  </div>
  <div class="fld"><label>Items</label>
  <button type="button" id="mScan" style="margin:0 0 10px">&#128247; Scan implant barcodes</button>
  <div id="mItems"></div>
  <button class="secondary" id="mAdd" style="margin-top:0">+ Add item</button></div>
  <div class="fldrow">
    <div class="fld"><label>Total (all items)</label><input id="mTotal" placeholder="$"></div>
    <div class="fld"><label>Freight / delivery</label><input id="mFreight" placeholder="$"></div>
    <div class="fld"><label>Grand Total</label><input id="mGrand" placeholder="$"></div>
  </div>
  <button id="mGo">Generate D-Ticket</button>
  <button class="secondary" id="mCancel">Cancel</button>
  <div class="stsub" id="mHint" style="margin-top:10px;display:none">Editing the current d-ticket — sticker photos you already added are kept.</div>
</div></div>
<div id="scanModal">
  <div id="scanHead"><b>Scan implants</b><button id="scanClose">Cancel</button></div>
  <div id="scanVidWrap"><video id="scanVid" playsinline muted autoplay></video><canvas id="scanOverlay"></canvas><div id="scanCool">✓ Got it — next implant</div></div>
  <div id="scanStatus">Starting camera…</div>
  <div id="scanTools"><button id="scanTorch" style="display:none">Light</button><button id="scanZoom" style="display:none">Zoom 2×</button></div>
  <div id="scanList"></div>
  <button id="scanDone">Add to d-ticket</button>
</div>
<div id="cropModal">
  <div id="cropTitle">Crop the sticker</div>
  <div id="cropStage">
    <img id="cropImg">
    <div id="cropRect"><div id="cropHandle"></div></div>
  </div>
  <div id="cropBtns">
    <button class="secondary" id="cropCancel">Cancel</button>
    <button class="secondary" id="cropRotate">&#10227; Rotate</button>
    <button id="cropOk">Use Crop</button>
  </div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument, StandardFonts, rgb } = PDFLib;

const $ = id => document.getElementById(id);
let outBytes = null, outName = "d-ticket.pdf";

$("file").addEventListener("change", e => { if (e.target.files[0]) run(e.target.files[0]); });
$("again").onclick = () => location.reload();
$("dl").onclick = async () => {
  const blob = new Blob([outBytes], { type: "application/pdf" });
  const file = new File([blob], outName, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) {}
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = outName; a.click();
};

function status(t, err) { const s = $("status"); s.textContent = t; s.className = err ? "err" : "";
  $("spin").style.display = (t && !err && !t.startsWith("Done")) ? "block" : "none"; }

async function showPreview(bytes) {
  try {
    const wrap = $("previewWrap");
    wrap.innerHTML = "";
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    const cw = Math.min(document.querySelector(".card").clientWidth - 40, 440);
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = (cw / vp1.width) * (window.devicePixelRatio || 2);
      const vp = page.getViewport({ scale });
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      wrap.appendChild(cv);
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    }
    wrap.style.display = "block";
  } catch (e) { /* preview optional */ }
}

const LABELS = ["Name","Rep ID#","Agency Name, Address & Phone Number","Account Name","Hospital Account ID#",
  "Billing Address","Shipping Address","Purchase Order #","Enovis Surgical Order #","Date",
  "Surgeon (Last, First, MI)","Surgery Type","Patient ID","Surgery Notes","Revision Surgery",
  "Revised Enovis Surgical Product","Non-Revision Product Complaint","Surgery Side","Subtotal","Total",
  "First and Last Name","(or Loaner Set ID#)","Ship To Acct #","Ship Via","Address, City, State, Zip",
  "Required Date","Hospital Authorized Signature","Printed Name","Sales Representative","Bill To",
  "Surgery Information","Surgery Specific Info","Ship To / Restock Information"];
const isLabel = s => LABELS.includes(s);
const clean = v => (v === "-" || v === "–") ? "" : v;

function groupRows(items) {
  const rows = [];
  for (const it of items.slice().sort((a,b) => b.y - a.y || a.x - b.x)) {
    const r = rows.find(r => Math.abs(r.y - it.y) < 3.5);
    if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
  }
  rows.forEach(r => r.items.sort((a,b) => a.x - b.x));
  return rows;
}

function makeLookups(items) {
  const findLabel = txt => items.find(i => i.str === txt) || null;
  function below(labelTxt, maxLines = 1, tolX = 95) {
    const lab = findLabel(labelTxt);
    if (!lab) return "";
    const cands = items.filter(i => i.y < lab.y - 2 && i.y > lab.y - 60 &&
                  i.x > lab.x - 8 && i.x < lab.x + tolX && !isLabel(i.str))
                  .sort((a,b) => b.y - a.y);
    const lines = [];
    let lastY = null;
    for (const c of cands) {
      if (lastY !== null && Math.abs(c.y - lastY) > 3.5) { if (lines.length >= maxLines) break; lines.push(c.str); }
      else if (lastY !== null) { lines[lines.length-1] += " " + c.str; }
      else lines.push(c.str);
      lastY = c.y;
      if (lines.length > maxLines) { lines.pop(); break; }
    }
    return lines.join(" ").replace(/\s+/g," ").trim();
  }
  function rightOf(labelTxt) {
    const labs = items.filter(i => i.str === labelTxt);
    for (const lab of labs) {
      const c = items.filter(i => Math.abs(i.y - lab.y) < 4 && i.x > lab.x + 5 && /^\$/.test(i.str))
                     .sort((a,b) => a.x - b.x)[0];
      if (c) return c.str;
    }
    return "";
  }
  return { findLabel, below, rightOf };
}

// parse the items table on one page; appends to cases[]
function parseTable(rows, cases) {
  const hdrRow = rows.find(r => r.items.some(i => i.str === "Part #") && r.items.some(i => i.str === "Lot #"));
  if (!hdrRow) return;
  const colX = {};
  for (const h of ["Loaner","Part #","Lot #","Expiry","Description","Rstk","I/O","Qty","Unit Price","Extended Price"]) {
    const c = hdrRow.items.find(i => i.str === h); if (c) colX[h] = c.x;
  }
  for (const r of rows) {
    if (r.y >= hdrRow.y - 2) continue;
    if (r.items.some(i => i.str === "Subtotal")) break;
    if (r.items.some(i => isLabel(i.str))) break;   // reached the footer section
    const cells = {};
    for (const it of r.items) {
      let best = null, bd = 1e9;
      for (const [h, hx] of Object.entries(colX)) {
        const d = Math.abs(it.x - hx);
        if (d < bd) { bd = d; best = h; }
      }
      if (bd < 55) cells[best] = (cells[best] ? cells[best] + " " : "") + it.str;
    }
    const cat = (cells["Part #"] || "").trim();
    const desc = (cells["Description"] || "").trim();
    const expiry = clean((cells["Expiry"] || "").trim());
    const extended = clean((cells["Extended Price"] || "").trim());
    const loanerCell = /^(y|yes|x|✓)$/i.test((cells["Loaner"] || "").trim());
    if (/construct/i.test(desc) || /construct/i.test(cat)) {
      cases.push({
        construct: true,
        catalog: ((desc || cat).replace(/\s+/g, " ").trim()),
        unit_price: extended || clean((cells["Unit Price"] || "").trim()),
        hospital_price: ""
      });
    } else if (cat && cat !== "-" && /\d/.test(cat) && cat.length <= 24) {
      cases.push({
        catalog: cat,
        lot: clean((cells["Lot #"] || "").trim()),
        expiry: expiry,
        qty: clean((cells["Qty"] || "").trim()),
        wasted: /^yes$/i.test((cells["I/O"] || "").trim()),   // I/O = in & out → wasted
        unit_price: clean((cells["Unit Price"] || "").trim()),
        hospital_price: extended,          // Extended Price → Total Price column
        loaner: loanerCell
      });
    } else if (cases.length) {
      // wrapped description row: fields may land here
      const last = cases[cases.length - 1];
      if (last.construct) {
        if (desc) last.catalog = (last.catalog + " " + desc).replace(/\s+/g, " ").trim();
        if (!last.unit_price && (extended || cells["Unit Price"])) last.unit_price = extended || clean(cells["Unit Price"].trim());
      } else {
        if (!last.unit_price && cells["Unit Price"]) last.unit_price = clean(cells["Unit Price"].trim());
        if (!last.hospital_price && extended) last.hospital_price = extended;

async function extractSticker(page) {
  try {
    const ops = await page.getOperatorList();
    const names = [];
    for (let i = 0; i < ops.fnArray.length; i++)
      if (ops.fnArray[i] === pdfjsLib.OPS.paintImageXObject) names.push(ops.argsArray[i][0]);
    for (const name of names) {
      const img = await new Promise(res => { try { page.objs.get(name, res); } catch(e) { res(null); } });
      if (!img || !img.width) continue;
      const ar = img.width / img.height;
      if (img.width > 600 || ar > 4 || ar < 1.2) continue;   // skip the wide enovis logo
      const cv = document.createElement("canvas");
      cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext("2d");
      if (img.bitmap) {
        ctx.drawImage(img.bitmap, 0, 0);
      } else if (img.data && img.data.length === img.width * img.height * 4) {
        ctx.putImageData(new ImageData(new Uint8ClampedArray(img.data), img.width, img.height), 0, 0);
      } else if (img.data && img.data.length === img.width * img.height * 3) {
        const rgba = new Uint8ClampedArray(img.width * img.height * 4);
        for (let p = 0, q = 0; p < img.data.length; p += 3, q += 4) {
          rgba[q] = img.data[p]; rgba[q+1] = img.data[p+1]; rgba[q+2] = img.data[p+2]; rgba[q+3] = 255;
        }
        ctx.putImageData(new ImageData(rgba, img.width, img.height), 0, 0);
      } else continue;
      return await new Promise(res => cv.toBlob(b => { const fr = new FileReader();
        fr.onload = () => res(new Uint8Array(fr.result)); fr.readAsArrayBuffer(b); }, "image/png"));
    }
  } catch (e) { /* sticker optional */ }
  return null;
}

async function fileToCanvas(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url;
  });
  const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv;
}

  const fr = new FileReader(); fr.onload = () => res(new Uint8Array(fr.result));

// ---- REF lookup in the FDA's device database (AccessGUDID) for barcodes the offline list doesn't know ----
const scanGudidCache = () => { try { return JSON.parse(localStorage.getItem('dt_gudid') || '{}'); } catch (e) { return {}; } };
const scanGudidPending = new Set();
async function scanGudid(it) {
  const gtin = it && it.pid; if (!gtin || !/^\d{14}$/.test(gtin) || scanGudidPending.has(gtin)) return;
  if (scanLearned()[gtin]) return;                       // REF the user typed wins
  const cache = scanGudidCache();
  let ref = cache[gtin];
  if (ref === undefined) {
    scanGudidPending.add(gtin);
    try {
      const r = await fetch('https://accessgudid.nlm.nih.gov/api/v3/devices/lookup.json?di=' + gtin);
      ref = r.ok ? (((await r.json()).gudid || {}).device || {}).catalogNumber || '' : (r.status === 404 ? '' : undefined);
    } catch (e) { ref = undefined; }                      // offline: try again next time
    scanGudidPending.delete(gtin);
    if (ref !== undefined) { const c = scanGudidCache(); c[gtin] = ref; try { localStorage.setItem('dt_gudid', JSON.stringify(c)); } catch (e) {} }
  }
  ref = (ref || '').trim();
  if (!ref || !scanSess) return;
  scanCtx.gtinMap[gtin] = ref;
  let changed = false;
  scanSess.items.forEach(x => { if (x.pid === gtin && x.ref !== ref && x.refSrc !== 'user') {
    scanSess.setRef(x.id, ref, x.name); x.ref = ref; x.refSrc = 'fda'; scanSess.updateItem(x.id, {}); changed = true; } });
  if (changed) { scanRender(); scanSay('✓ REF ' + ref + ' (FDA device database)'); }
}

// ---- sticker photo from the scan: keep the frame each implant was read from ----
const scanShots = new Map();    // item id → { cv (full-res frame), quads (barcodes of that label) }
const scanPhotos = new Map();   // item id → { bytes, url }
const scanNativeCv = document.createElement('canvas');
let scanPaused = false;
function scanCapture(item, quads) {
  if (!item || !quads.length || !scanNativeCv.width) return;
  const k = scanNativeCv.width / scanFrameCv.width;
  const cv = document.createElement('canvas'); cv.width = scanNativeCv.width; cv.height = scanNativeCv.height;
  cv.getContext('2d').drawImage(scanNativeCv, 0, 0);
  scanShots.set(item.id, { cv, quads: quads.map(q => q.map(p => ({ x: p.x * k, y: p.y * k }))) });
}
// barcodes of the label that was just read: same LOT/REF and physically next to each other
// (keeps identical stickers sitting side by side apart)
function scanLabelQuads(t, results, it, fw, fh) {
  const quad = r => { const p = r.position; return [p.topLeft, p.topRight, p.bottomRight, p.bottomLeft]; };
  const bb = r => { const q = quad(r), xs = q.map(v => v.x), ys = q.map(v => v.y); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; };
  const gap = (a, b) => { const A = bb(a), B = bb(b); return Math.max(0, Math.max(A[0], B[0]) - Math.min(A[2], B[2])) + Math.max(0, Math.max(A[1], B[1]) - Math.min(A[3], B[3])); };
  const mine = results.filter(r => { if (r === t) return true; if (!r.position || !it) return false;
    const x = ImplantKit.interpretScan(r.text, scanCtx); return (x.lot && x.lot === it.lot) || (x.ref && x.ref === it.ref); });
  const grp = [t], lim = Math.max(fw, fh) * 0.08;
  for (let ch = true; ch;) { ch = false; for (const r of mine) if (!grp.includes(r) && grp.some(g => gap(g, r) < lim)) { grp.push(r); ch = true; } }
  return grp.filter(r => r.position).map(quad);
}
async function scanCropItem(id) {
  const rec = scanShots.get(id); if (!rec) return;
  scanPaused = true;
  try {
    const src = rec.cv; let cv = src, init = null;
    try {
      const det = autoSticker(src.getContext('2d').getImageData(0, 0, src.width, src.height).data, src.width, src.height, rec.quads);
      if (det) {
        if (Math.abs(det.angle) > 0.004) {            // straighten so the label is level (and upright)
          cv = document.createElement('canvas'); cv.width = det.W2; cv.height = det.H2;
          const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, det.W2, det.H2);
          g.translate(det.W2 / 2, det.H2 / 2); g.rotate(-det.angle); g.drawImage(src, -src.width / 2, -src.height / 2);
        }
        init = det.rect;
      }
    } catch (e) { console.warn('auto sticker', e); }
    const out = await openCropper(cv, 'Sticker found — drag to adjust, then Use', init);
    if (!out) return;
    scanPhotos.set(id, { bytes: await canvasToJpeg(out), url: out.toDataURL('image/jpeg', 0.6) });
    scanRender();
  } catch (e) { alert('Could not crop that sticker: ' + e.message); }
  finally { scanPaused = false; }
}

function scanOnRaw(raw) {
  const now = Date.now(), ev = scanSess.handle(raw, now, scanCtx);
  if (ev.type === 'ignored') return ev;
  if (ev.type === 'added' || (ev.type === 'filled' && ev.completed)) { scanBeep(true); scanFlash('#30d158'); scanSay('✓ ' + ev.item.ref + '  LOT ' + ev.item.lot + '  EXP ' + isoToUS(ev.item.exp)); }
  else if (ev.type === 'held' || ev.type === 'filled' || ev.type === 'waiting') { scanBeep(true); scanFlash('#ffd60a');
    scanSay(ev.type === 'waiting' ? 'Got LOT/EXP — now scan the product barcode' : ev.item && ev.item.status === 'needsLot' ? 'Got REF — now scan the LOT barcode' : 'Scanned — REF needed, type it below'); }
  else if (ev.type === 'duplicate') {
    scanBeep(false); scanFlash('#ffd60a');
    const add = confirm('Already scanned ' + ev.item.ref + ' LOT ' + ev.item.lot + '. Add another one?');
    scanSess.resolveDuplicate(add, Date.now());
    scanSay(add ? 'Added another ' + ev.item.ref : 'Skipped duplicate');
  } else if (ev.type === 'unknown') { scanBeep(false); scanFlash('#ff453a'); scanSay('Barcode not recognized — try the square UDI barcode'); }
  scanRender();
  return ev;
}

// ---- live camera loop: zxing-cpp (WebAssembly) finds every barcode in the frame + its corners ----
const SCAN_COOLDOWN_MS = 1500;      // pause after each accepted scan so one implant isn't counted twice
const SCAN_FORMATS = ['DataMatrix', 'QRCode', 'Code128', 'Code39', 'EAN-13', 'UPC-A', 'PDF417', 'Aztec', 'DataBarExpanded'];
let scanLoopOn = false, scanCoolUntil = 0, scanStableText = '', scanStableN = 0;
const scanSeen = new Map();          // text → last time it was in the frame
const scanDone = new Map();          // text → 'ok' | 'bad' (already handled while it stays in view)
const scanFrameCv = document.createElement('canvas');
let scanWasmReady = null;

function scanPrepWasm() {
  if (!scanWasmReady) scanWasmReady = (async () => {
    for (let i = 0; i < 50 && !window.ZXingWASM; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.ZXingWASM) throw new Error('barcode reader failed to load');
    await ZXingWASM.prepareZXingModule({
      overrides: { locateFile: (p, prefix) => p.endsWith('.wasm') ? new URL('zxing_reader.wasm', location.href).href : prefix + p },
      fireImmediately: true });
  })();
  return scanWasmReady;
}

function scanDraw(results, fw, fh, now) {
  const ov = $('scanOverlay'), wrap = $('scanVidWrap'), dpr = window.devicePixelRatio || 1;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  if (ov.width !== Math.round(cw * dpr)) { ov.width = Math.round(cw * dpr); ov.height = Math.round(ch * dpr); }
  const g = ov.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, cw, ch);
  if (!results || !fw) return;
  const k = Math.max(cw / fw, ch / fh), ox = (cw - fw * k) / 2, oy = (ch - fh * k) / 2;   // object-fit: cover
  const P = pt => [pt.x * k + ox, pt.y * k + oy];
  results.forEach(r => {
    const p = r.position; if (!p) return;
    let pts = [p.topLeft, p.topRight, p.bottomRight, p.bottomLeft].map(P);
    // long 1D barcodes come back thin: give the box some height so it's easy to see
    const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
    if (Math.max(...ys) - Math.min(...ys) < 18) { const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
      pts = [[Math.min(...xs), cy - 12], [Math.max(...xs), cy - 12], [Math.max(...xs), cy + 12], [Math.min(...xs), cy + 12]]; }
    const ok = scanDone.get(r.text) === 'ok';
    g.lineWidth = 4; g.strokeStyle = ok ? '#30d158' : '#ff3b30';
    g.fillStyle = ok ? 'rgba(48,209,88,.18)' : 'rgba(255,59,48,.12)';
    g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); g.stroke();
  });
}

function scanPickTarget(cands, fw, fh) {
  const cx = fw / 2, cy = fh / 2;
  const center = r => { const p = r.position; return [(p.topLeft.x + p.bottomRight.x) / 2, (p.topLeft.y + p.bottomRight.y) / 2]; };
  const dist = r => { const [x, y] = center(r); return Math.hypot(x - cx, y - cy); };
  const twoD = cands.filter(r => /DataMatrix|QR|Aztec/.test(r.format));    // square UDI codes carry REF+LOT+EXP
  const pool = twoD.length ? twoD : cands;
  return pool.slice().sort((a, b) => dist(a) - dist(b))[0];
}

function scanHandleFrame(results, fw, fh) {
  const now = Date.now();
  results.forEach(r => scanSeen.set(r.text, now));
  // a barcode that has left the view for a while can be scanned again (session will ask "add another?")
  for (const [t] of scanDone) if (now - (scanSeen.get(t) || 0) > SCAN_COOLDOWN_MS) scanDone.delete(t);
  const cooling = now < scanCoolUntil;
  $('scanCool').style.display = cooling ? 'block' : 'none';
  if (!cooling) {
    const cands = results.filter(r => r.text && !scanDone.has(r.text));
    const t = cands.length ? scanPickTarget(cands, fw, fh) : null;
    if (t && t.text === scanStableText) scanStableN++; else { scanStableText = t ? t.text : ''; scanStableN = t ? 1 : 0; }
    if (t && scanStableN >= 2) {                          // seen in 2 frames in a row → accept
      scanStableText = ''; scanStableN = 0;
      const ev = scanOnRaw(t.text);
      const good = ev && ev.type !== 'unknown';
      scanDone.set(t.text, good ? 'ok' : 'bad');
      if (good) {
        scanCoolUntil = Date.now() + SCAN_COOLDOWN_MS;
        // other barcodes on the same label (same REF or LOT) are part of this implant → green too
        const it = ev.item || (scanSess.lastItem);
        if (it && !scanShots.has(it.id)) scanCapture(it, scanLabelQuads(t, results, it, fw, fh));
        results.forEach(r => { if (r === t || scanDone.has(r.text) || !it) return;
          const x = ImplantKit.interpretScan(r.text, scanCtx);
          if ((x.lot && x.lot === it.lot) || (x.ref && x.ref === it.ref)) { scanDone.set(r.text, 'ok'); scanSess.handle(r.text, Date.now(), scanCtx); } });
        if (it) scanGudid(it);
        scanRender();
      }
    }
  }
  scanDraw(results, fw, fh, now);
}

async function scanLoop() {
  if (!scanLoopOn) return;
  const v = $('scanVid');
  try {
    if (!scanPaused && v.readyState >= 2 && v.videoWidth) {
      const vw = v.videoWidth, vh = v.videoHeight, sc = Math.min(1, 1280 / Math.max(vw, vh));
      const w = Math.round(vw * sc), h = Math.round(vh * sc);
      if (scanNativeCv.width !== vw || scanNativeCv.height !== vh) { scanNativeCv.width = vw; scanNativeCv.height = vh; }
      scanNativeCv.getContext('2d').drawImage(v, 0, 0, vw, vh);       // full-res copy (for the sticker photo)
      if (scanFrameCv.width !== w) { scanFrameCv.width = w; scanFrameCv.height = h; }
      const cx = scanFrameCv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(scanNativeCv, 0, 0, w, h);
      const res = await ZXingWASM.readBarcodes(cx.getImageData(0, 0, w, h),
        { formats: SCAN_FORMATS, tryHarder: true, maxNumberOfSymbols: 8 });
      if (scanLoopOn) scanHandleFrame(res.filter(r => r.isValid !== false && r.text), w, h);
    }
  } catch (e) { console.warn('scan frame', e); }
  if (scanLoopOn) setTimeout(scanLoop, 40);
}

async function scanOpen() {
  $('scanModal').classList.add('open');
  scanSess = null; scanRender(); scanSay('Starting camera…');
  scanSeen.clear(); scanDone.clear(); scanCoolUntil = 0; scanStableText = ''; scanStableN = 0;
  scanShots.clear(); scanPhotos.clear(); scanPaused = false;
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    const v = $('scanVid'); v.srcObject = scanStream; v.setAttribute('playsinline', ''); v.muted = true;
    await v.play().catch(() => {});
    scanTrack = scanStream.getVideoTracks()[0];
    try { await scanTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    const caps = scanTrack.getCapabilities ? scanTrack.getCapabilities() : {};
    $('scanTorch').style.display = caps.torch ? 'block' : 'none';
    $('scanZoom').style.display = caps.zoom && caps.zoom.max >= 2 ? 'block' : 'none';
  } catch (e) { scanSay('Camera unavailable: ' + (e.message || e) + '. Allow camera access for this site in Settings → Safari → Camera.'); return; }
  scanSay('Loading barcode reader…');
  try { await Promise.all([scanPrepWasm(), scanLoadData()]); } catch (e) { scanSay('Could not load the scanner: ' + e.message); return; }
  scanSess = ImplantKit.createScanSession();
  scanCtx = { gtinMap: { ...SCAN_SEED_GTIN, ...scanLearned() }, userCatalog: {} };
  scanRender();

  scanLoopOn = true; scanLoop();
}
function scanStop() {
  scanLoopOn = false;
  try { scanStream && scanStream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { $('scanVid').srcObject = null; } catch (e) {}
  scanStream = scanTrack = null; scanTorchOn = false;
  scanDraw(null);
  $('scanModal').classList.remove('open');
}
$('mScan').onclick = e => { e.preventDefault(); scanOpen(); };
$('scanClose').onclick = scanStop;
$('scanTorch').onclick = () => { scanTorchOn = !scanTorchOn; try { scanTrack.applyConstraints({ advanced: [{ torch: scanTorchOn }] }); } catch (e) {}
  $('scanTorch').textContent = scanTorchOn ? 'Light on' : 'Light'; };
$('scanZoom').onclick = () => { const z = $('scanZoom').textContent.includes('2') ? 2 : 1;

// ---- sticker photo handling ----
let lastData = null, lastStickerPng = null, lastPatientLast = "";

// crop image to the bright label region (works when sticker is photographed
// against a darker background); falls back to the full frame
function autoTrim(cv) {
  try {
    const w = cv.width, h = cv.height;
    const sc = Math.min(1, 160 / Math.max(w, h));
    const sw = Math.max(1, Math.round(w * sc)), sh = Math.max(1, Math.round(h * sc));
    const small = document.createElement("canvas");
    small.width = sw; small.height = sh;
    const sctx = small.getContext("2d");
    sctx.drawImage(cv, 0, 0, sw, sh);
    const px = sctx.getImageData(0, 0, sw, sh).data;
    const lum = (i) => 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
    // border median luminance = background estimate
    const border = [];
    for (let x = 0; x < sw; x++) { border.push(lum((x)*4), lum(((sh-1)*sw+x)*4)); }
    for (let y = 0; y < sh; y++) { border.push(lum((y*sw)*4), lum((y*sw+sw-1)*4)); }
    border.sort((a,b) => a-b);
    const bg = border[Math.floor(border.length/2)];
    if (bg > 160) return null;   // background already light (scan/sheet) — keep full frame
    let minX = sw, minY = sh, maxX = 0, maxY = 0, n = 0;
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      if (lum((y*sw+x)*4) > bg + 55) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        n++;
      }
    }
    if (n < sw*sh*0.03 || maxX <= minX || maxY <= minY) return null;
    const mx = (maxX-minX)*0.03, my = (maxY-minY)*0.03;
    return { x: Math.max(0,(minX-mx))/sc, y: Math.max(0,(minY-my))/sc,
             w: Math.min(w,(maxX-minX+2*mx))/sc, h: Math.min(h,(maxY-minY+2*my))/sc };
  } catch (e) { return null; }
}

// aspect ratio of the sticker box on the d-ticket (crop is locked to this,
// so the crop fills the row exactly)
function boxAspect() {
  const bar_h = 16, hdr_h = 13, pad = 2.5, strip = 9;
  const grid_top = TOP - bar_h - hdr_h, grid_bot = BOT + 20, row_h = (grid_top - grid_bot) / 12;
  const bw = LABEL_W - 2*pad - 4, bh = row_h - 2*pad - strip - 4;
  return bw / bh;
}

function rotate90(cv) {
  const out = document.createElement("canvas");
  out.width = cv.height; out.height = cv.width;
  const ctx = out.getContext("2d");
  ctx.translate(out.width / 2, out.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(cv, -cv.width / 2, -cv.height / 2);
  return out;
}

// ---- manual crop modal (free-form crop + rotate) ----
function openCropper(srcCanvas, idx, initRect) {
  return new Promise(resolve => {
    const modal = $("cropModal"), stage = $("cropStage"), imgEl = $("cropImg"),
          rect = $("cropRect"), handle = $("cropHandle");
    $("cropTitle").textContent = (typeof idx === "string") ? idx
      : (idx < 0 ? "Crop the patient sticker"
      : "Crop sticker " + (idx+1) + " — " + (lastData.items[idx].catalog || ""));
    modal.classList.add("open");
    const AR = boxAspect();
    let src = srcCanvas;
    let iw, ih, ox, oy, scale;   // displayed image geometry
    let r = { x: 0, y: 0, w: 0, h: 0 };

    function layout() {
      const sw = stage.clientWidth, sh = stage.clientHeight;
      scale = Math.min(sw / src.width, sh / src.height);
      iw = src.width * scale; ih = src.height * scale;
      ox = (sw - iw) / 2; oy = (sh - ih) / 2;
      imgEl.src = src.toDataURL("image/jpeg", 0.8);
      imgEl.style.left = ox + "px"; imgEl.style.top = oy + "px";
      imgEl.style.width = iw + "px"; imgEl.style.height = ih + "px";
      // initial crop: auto-detected region if available, else row-shaped and centered
      const auto = initRect || autoTrim(src);
      initRect = null;   // after a rotate, fall back to the generic detector
      if (auto) {
        r.w = auto.w * scale; r.h = auto.h * scale;
        r.x = ox + auto.x * scale; r.y = oy + auto.y * scale;
      } else {
        r.w = iw * 0.9; r.h = r.w / AR;
        if (r.h > ih * 0.9) { r.h = ih * 0.9; }
        r.x = ox + (iw - r.w)/2; r.y = oy + (ih - r.h)/2;
      }
      clampRect(); applyRect();
    }
    function clampRect() {
      r.w = Math.min(Math.max(r.w, 40), iw);
      r.h = Math.min(Math.max(r.h, 24), ih);
      r.x = Math.min(Math.max(r.x, ox), ox + iw - r.w);
      r.y = Math.min(Math.max(r.y, oy), oy + ih - r.h);
    }
    function applyRect() {
      rect.style.left = r.x + "px"; rect.style.top = r.y + "px";
      rect.style.width = r.w + "px"; rect.style.height = r.h + "px";
    }
    let mode = null, sx = 0, sy = 0, start = null;
    function down(e, m) {
      mode = m; sx = e.clientX; sy = e.clientY; start = { ...r };
      e.preventDefault(); e.stopPropagation();
    }
    rect.addEventListener("pointerdown", e => { if (e.target === handle) return; down(e, "move"); });
    handle.addEventListener("pointerdown", e => down(e, "resize"));
    window.addEventListener("pointermove", e => {
      if (!mode) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (mode === "move") { r.x = start.x + dx; r.y = start.y + dy; }
      else {
        // free-form resize: width and height independent
        r.w = Math.max(40, start.w + dx);
        r.h = Math.max(24, start.h + dy);
      }
      clampRect(); applyRect();
    });
    window.addEventListener("pointerup", () => { mode = null; });

    $("cropRotate").onclick = () => { src = rotate90(src); layout(); };

    function done(ok) {
      modal.classList.remove("open");
      if (!ok) { resolve(null); return; }
      // map display rect -> source pixels
      const sxp = (r.x - ox) / scale, syp = (r.y - oy) / scale;
      const swp = r.w / scale, shp = r.h / scale;
      const out = document.createElement("canvas");
      out.width = Math.round(swp); out.height = Math.round(shp);
      out.getContext("2d").drawImage(src, sxp, syp, swp, shp, 0, 0, out.width, out.height);
      resolve(out);
    }
    $("cropOk").onclick = () => done(true);
    $("cropCancel").onclick = () => done(false);
    requestAnimationFrame(layout);
  });
}

async function processStickerPhoto(file, idx) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url;
  });
  const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  const out = await openCropper(cv, idx);
  if (!out) return false;   // cancelled
  const bytes = await new Promise(res => out.toBlob(b => {
    const fr = new FileReader(); fr.onload = () => res(new Uint8Array(fr.result));
    fr.readAsArrayBuffer(b); }, "image/jpeg", 0.85));
  lastData.items[idx].photo = bytes;
  lastData.items[idx].photoUrl = out.toDataURL("image/jpeg", 0.6);
  return true;
}

async function processPatientPhoto(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url;
  });
  const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  const out = await openCropper(cv, -1);
  if (!out) return false;
  lastStickerPng = await new Promise(res => out.toBlob(b => {
    const fr = new FileReader(); fr.onload = () => res(new Uint8Array(fr.result));
    fr.readAsArrayBuffer(b); }, "image/png"));
  lastData.patientThumb = out.toDataURL("image/jpeg", 0.6);
  return true;
}

async function run(f) {
  try {
    status("Reading sales order…");
    const buf = await f.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;

    let page1Items = null;
    const cases = [];
    let totalStr = "", grandStr = "", bodyAll = "";
    let stickerPng = null;

    // ---- scan ALL pages ----
    for (let p = 1; p <= pdf.numPages; p++) {
      status("Reading page " + p + " of " + pdf.numPages + "…");
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.map(i => ({ str: i.str.trim(), x: i.transform[4], y: i.transform[5] }))
                            .filter(i => i.str);
      if (p === 1) page1Items = items;
      bodyAll += " " + items.map(i => i.str).join(" ");
      parseTable(groupRows(items), cases);
      const lk = makeLookups(items);
      const st = lk.rightOf("Subtotal"); if (st) totalStr = st;
      let gt = lk.rightOf("Total");
      if (!gt) {
        const totLab = items.filter(i => i.str === "Total").sort((a,b) => a.y - b.y)[0];
        if (totLab) {
          const c = items.filter(i => i.y < totLab.y + 4 && i.y > totLab.y - 40 && /^\$[\d,.]+$/.test(i.str))
                         .sort((a,b) => b.y - a.y)[0];
          if (c) gt = c.str;
        }
      }
      if (gt) grandStr = gt;
      if (!stickerPng) stickerPng = await extractSticker(page);
    }

    // ---- header fields from page 1 ----
    const { below } = makeLookups(page1Items);
    const rawDate = below("Date");
    let surgery_date = rawDate;
    const m = rawDate.match(/([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})/);
    if (m) {
      const mo = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"]
                 .indexOf(m[1].slice(0,3).toLowerCase()) + 1;
      surgery_date = String(mo).padStart(2,"0") + "/" + m[2].padStart(2,"0") + "/" + m[3];
    }
    const surgeonRaw = below("Surgeon (Last, First, MI)");
    const surgeon = surgeonRaw ? "Dr. " + surgeonRaw.split(/[,\s]+/)[0] : "";
    const patientRaw = below("Patient ID", 2, 150);
    const patientLast = (patientRaw.split(",")[0] || "").trim();
    const yn = v => /^y/i.test(v) ? "Y" : (/^n/i.test(v) ? "N" : "");
    const S = getSettings();
    const repFromOrder = clean(below("Name"));   // Sales Representative → Name

    const data = {
      ib_case: clean(below("Enovis Surgical Order #")),
      hospital: clean(below("Account Name", 2, 150)),
      hospital_code: clean(below("Hospital Account ID#")),
      surgery_date,
      side: (below("Surgery Side").toUpperCase().match(/[LR]/) || [""])[0],
      revision: yn(below("Revision Surgery")),
      revised_product: yn(below("Revised Enovis Surgical Product")),
      po: clean(below("Purchase Order #")),
      surgeon,
      rep: repFromOrder || S.rep,
      repFromOrder: !!repFromOrder,
      agency: S.agency,
      site: S.site,
      notes: below("Surgery Type") ? "Surgery Type: " + below("Surgery Type") : "",
      items: cases,
      total: totalStr,
      freight: "",
      grand_total: grandStr || totalStr
    };
    if (data.hospital_code) data.hospital = data.hospital.replace(data.hospital_code, "").replace(/\s+/g, " ").trim();
    if (/ARVIS/i.test(bodyAll)) data.arvis_note = true;

    status("Building d-ticket…");
    lastData = data; lastStickerPng = stickerPng; lastPatientLast = patientLast;
    outBytes = await buildTicket(data, stickerPng);
    outName = "DT - " + (data.ib_case || "order") + (patientLast ? " " + patientLast : "") + ".pdf";
    renderStickerUI();

    const pages = Math.max(1, Math.ceil(data.items.length / 12));
    const s = $("summary");
    s.style.display = "block";
    s.innerHTML = "<b>Order #</b>" + (data.ib_case||"—") + "<br><b>Hospital</b>" + (data.hospital||"—") +
      "<br><b>Surgeon</b>" + (data.surgeon||"—") + "<br><b>Date</b>" + (data.surgery_date||"—") +
      "<br><b>Items</b>" + (data.items.length ? data.items.length + " — " + data.items.map(i=>i.catalog).join(", ") : "—") +
      "<br><b>Total</b>" + (data.grand_total||"—") +
      "<br><b>Pages</b>" + pages +
      "<br><b>Sticker</b>" + (stickerPng ? "included" : "not found — apply physical sticker") +
      (data.arvis_note ? "<br><b style='color:#b00020'>ARVIS</b> mentioned on order — mark the ARVIS box manually" : "");
    $("notesBox").value = data.notes || "";
    $("notesWrap").style.display = "block";
    status("Done. Review, then save.");
    $("dl").style.display = "block";
    $("editBtn").style.display = "block";
    $("again").style.display = "block";
    $("drop").style.display = "none";
    $("startBtns").style.display = "none";
    await showPreview(outBytes);
  } catch (e) {
    console.error(e);
    status("Couldn't process that PDF — is it an Enovis sales order? (" + e.message + ")", true);
  }
}

// ================= D-TICKET LAYOUT =================
const W = 612, H = 792, M = 28.8;
const LEFT_W = 154.8, GAP2 = 8.64, RIGHT_X = M + LEFT_W + GAP2, RIGHT_W = W - M - RIGHT_X;
const PRICE_W = 108, LABEL_W = RIGHT_W - PRICE_W, TOP = H - M, BOT = M + 68.4;

function makeDraw(pg) {
  const dark = rgb(0.102,0.102,0.102), greyC = rgb(0.4,0.4,0.4), lightC = rgb(0.91,0.91,0.91),
        whiteC = rgb(1,1,1), ink = rgb(0,0,0);
  const line = (x1,y1,x2,y2,wd,col,dash) => pg.drawLine({ start:{x:x1,y:y1}, end:{x:x2,y:y2},
      thickness: wd, color: col, dashArray: dash });
  const rect = (x,y,w,h,opt) => pg.drawRectangle(Object.assign({x,y,width:w,height:h}, opt));
  const txt = (t,x,y,f,s,col) => pg.drawText(String(t), {x, y, font:f, size:s, color: col||dark});
  const ctr = (t,cx,y,f,s,col) => txt(t, cx - f.widthOfTextAtSize(String(t),s)/2, y, f, s, col);
  const rtx = (t,rx,y,f,s,col) => txt(t, rx - f.widthOfTextAtSize(String(t),s), y, f, s, col);
  const check = (x,y) => {
    line(x, y+3.2, x+2.4, y+0.6, 1.3, ink);
    line(x+2.4, y+0.6, x+6.6, y+7.4, 1.3, ink);
  };
  return { line, rect, txt, ctr, rtx, check, dark, greyC, lightC, whiteC, ink, pg };
}

// header bar + column headers + 12-row sticker grid; returns grid bottom y
function drawGrid(d, HB, HV, itemsChunk, startIdx) {
  startIdx = startIdx || 0;
  const bar_h = 16;
  d.rect(RIGHT_X, TOP-bar_h, RIGHT_W, bar_h, {color: d.dark});
  d.txt("PLACE LABEL BELOW OR PRINT NUMBER", RIGHT_X+4, TOP-bar_h+4.5, HB, 7.5, d.whiteC);
  d.rtx("* PLEASE INDICATE LOANER ITEMS", RIGHT_X+RIGHT_W-4, TOP-bar_h+4.5, HB, 7.5, d.whiteC);
  const hdr_h = 13, hy = TOP - bar_h - hdr_h;
  d.rect(RIGHT_X, hy, RIGHT_W, hdr_h, {color: d.lightC, borderColor: d.dark, borderWidth: 0.75});
  d.txt("*", RIGHT_X+4, hy+3.5, HB, 7);
  d.txt("Catalog Number", RIGHT_X+12, hy+3.5, HB, 7);
  d.txt("Lot Number", RIGHT_X+LABEL_W/2+6, hy+3.5, HB, 7);
  d.ctr("Unit Price", RIGHT_X+LABEL_W+PRICE_W*0.25, hy+3.5, HB, 7);
  d.ctr("Total Price", RIGHT_X+LABEL_W+PRICE_W*0.75, hy+3.5, HB, 7);
  d.line(RIGHT_X+LABEL_W, hy, RIGHT_X+LABEL_W, hy+hdr_h, 0.75, d.dark);
  d.line(RIGHT_X+LABEL_W+PRICE_W/2, hy, RIGHT_X+LABEL_W+PRICE_W/2, hy+hdr_h, 0.75, d.dark);

  const rowsN = 12, grid_top = hy, grid_bot = BOT + 20, row_h = (grid_top-grid_bot)/rowsN;
  for (let i = 0; i < rowsN; i++) {
    const y = grid_top - (i+1)*row_h, pad = 2.5;
    const hasItem = i < itemsChunk.length;
    const strip = hasItem ? 9 : 0;   // thin reference strip at the top of filled rows
    // empty dashed box for the PHYSICAL implant sticker
    d.rect(RIGHT_X+pad, y+pad, LABEL_W-2*pad, row_h-2*pad-strip, {borderColor: d.greyC, borderWidth: 0.75, borderDashArray:[2,2]});
    if (!hasItem) d.line(RIGHT_X+LABEL_W/2, y+pad, RIGHT_X+LABEL_W/2, y+row_h-pad, 0.75, d.greyC, [2,2]);
    d.rect(RIGHT_X+LABEL_W, y, PRICE_W/2, row_h, {borderColor: d.dark, borderWidth: 0.75});
    d.rect(RIGHT_X+LABEL_W+PRICE_W/2, y, PRICE_W/2, row_h, {borderColor: d.dark, borderWidth: 0.75});
    d.rect(RIGHT_X, y, LABEL_W, row_h, {borderColor: d.dark, borderWidth: 0.75});
    if (hasItem) {
      const it = itemsChunk[i];
      if (it.construct) {
        // construct row: name + total price, no sticker needed
        d.txt((startIdx + i + 1) + ":  CONSTRUCT", RIGHT_X+6, y+row_h-7.5, HV, 6, d.greyC);
        const nm = (it.catalog || "CONSTRUCT").slice(0, 64);
        d.ctr(nm, RIGHT_X + LABEL_W/2, y + (row_h - strip)/2 - 3, HB, 8, d.ink);
        if (it.unit_price) d.ctr(it.unit_price, RIGHT_X+LABEL_W+PRICE_W*0.25, y+row_h/2-3, HV, 8, d.ink);
        continue;
      }
      // reference line: row #, REF, LOT, EXP above the sticker area
      const parts = [];
      if (it.catalog) parts.push("REF " + it.catalog);
      if (it.lot) parts.push("LOT " + it.lot);
      if (it.expiry) parts.push("EXP " + it.expiry);
      if (it.qty) parts.push("QTY " + it.qty);
      let ref = (startIdx + i + 1) + (parts.length ? ":  " + parts.join("   ") : ":");
      if (it.loaner) ref = "* " + ref;
      // right-hand markers: WASTED sits at the far right edge, sticker cue to its left
      const wLbl = "WASTED";
      const wW = it.wasted ? HB.widthOfTextAtSize(wLbl, 7) + 8 : 0;
      const cueX = RIGHT_X + LABEL_W - 86 - wW;
      while (ref.length && HV.widthOfTextAtSize(ref, 6) > (cueX - 4) - (RIGHT_X + 6)) ref = ref.slice(0, -1);
      d.txt(ref, RIGHT_X+6, y+row_h-7.5, HV, 6, d.greyC);
      if (it.wasted)   // I/O on the sales order — bold, far right, clear of the sticker box
        d.rtx(wLbl, RIGHT_X + LABEL_W - 5, y + row_h - 7.8, HB, 7, d.ink);
      if (it.img) {
        // sticker photo scaled to its row; tall/narrow crops may bleed slightly
        // past the dashed box so different sticker shapes stay legible
        const bw = LABEL_W - 2*pad - 4, bh = row_h - 2*pad - strip - 4;
        const sc2 = Math.min((bw * 1.02) / it.img.width, (bh * 1.35) / it.img.height);
        const iw = it.img.width * sc2, ih = it.img.height * sc2;
        d.pg.drawImage(it.img, { x: RIGHT_X + pad + 2 + (bw - iw)/2,
                                 y: y + pad + 2 + (bh - ih)/2, width: iw, height: ih });
      } else if (it.desc) {
        // no sticker: the typed description fills the sticker area in large text
        const txt0 = String(it.desc).replace(/[^\x20-\x7E\u00A0-\u00FF]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
        const bw = LABEL_W - 2*pad - 12, bh = row_h - 2*pad - strip - 4;
        const wrap = (sz) => { const words = txt0.split(" "), lines = []; let cur = "";
          for (const w of words) { const t = cur ? cur + " " + w : w;
            if (HB.widthOfTextAtSize(t, sz) <= bw) cur = t; else { if (cur) lines.push(cur); cur = w; } }
          if (cur) lines.push(cur); return lines; };
        let sz = 13, lines = wrap(sz);
        while (sz > 6 && (lines.length * sz * 1.15 > bh || lines.some(l => HB.widthOfTextAtSize(l, sz) > bw))) { sz -= 0.5; lines = wrap(sz); }
        const lh = sz * 1.15, cy = y + pad + 2 + bh / 2, top0 = cy + (lines.length * lh) / 2 - sz * 0.85;
        lines.forEach((l, k) => d.ctr(l, RIGHT_X + LABEL_W / 2, top0 - k * lh, HB, sz, d.ink));
      } else {
        d.txt("PLACE STICKER BELOW", cueX, y+row_h-7.5, HB, 5.5, d.greyC);
      }
      if (it.unit_price) {
        const uy = it.qty && +it.qty > 1 ? y+row_h/2+1 : y+row_h/2-3;
        d.ctr(it.unit_price, RIGHT_X+LABEL_W+PRICE_W*0.25, uy, HV, 8, d.ink);
        if (it.qty && +it.qty > 1)
          d.ctr("x " + it.qty, RIGHT_X+LABEL_W+PRICE_W*0.25, y+row_h/2-8, HB, 7, d.ink);
      }
      if (it.hospital_price) d.ctr(it.hospital_price, RIGHT_X+LABEL_W+PRICE_W*0.75, y+row_h/2-3, HV, 8, d.ink);
    }
  }
  return grid_bot;
}

function drawBorder(d) {
  const b = 15.84;
  d.rect(b, b, W-2*b, H-2*b, {borderColor: d.dark, borderWidth: 2.5});
}

async function buildTicket(D, stickerPng) {
  const doc = await PDFDocument.create();
  const HB = await doc.embedFont(StandardFonts.HelveticaBold);
  const HV = await doc.embedFont(StandardFonts.Helvetica);
  const allItems = D.items || [];
  for (const it of allItems) {
    it.img = null;
    if (it.photo) { try { it.img = await doc.embedJpg(it.photo); } catch (e) {} }
  }
  const chunks = [];
  const nChunks = Math.max(1, Math.ceil(allItems.length / 12));
  for (let i = 0; i < nChunks; i++) chunks.push(allItems.slice(i*12, i*12+12));
  const totalPages = chunks.length;

  // ============ PAGE 1 ============
  const pg = doc.addPage([W, H]);
  const d = makeDraw(pg);
  const grid_bot = drawGrid(d, HB, HV, chunks[0], 0);

  // totals
  const th = 14, tw = 208.8, tx = RIGHT_X + RIGHT_W - tw;
  [["TOTAL (ALL ITEMS)", D.total], ["FREIGHT/DELIVERY FEE", D.freight], ["GRAND TOTAL", D.grand_total]]
  .forEach(([lab, v], j) => {
    const yy = grid_bot - (j+1)*th;
    if (j === 2) { d.rect(tx, yy, tw*0.55, th, {color: d.dark}); d.txt(lab, tx+4, yy+4, HB, 8, d.whiteC); }
    else d.txt(lab, tx+4, yy+4, HB, 8);
    d.rect(tx, yy, tw*0.55, th, {borderColor: d.dark, borderWidth: 0.75});
    d.rect(tx+tw*0.55, yy, tw*0.45, th, {borderColor: d.dark, borderWidth: 0.75});
    if (v) d.txt(v, tx+tw*0.55+6, yy+4, HV, 8, d.ink);
  });

  // left sidebar
  const x = M; let y = TOP;
  const hline = yy => d.line(x, yy, x+LEFT_W, yy, 0.5, d.greyC);
  const blank = (x0,yy,x1) => d.line(x0, yy, x1, yy, 0.6, d.dark);
  d.txt("DJO / Enovis", x, y-20, HB, 20); y -= 40;
  d.txt("SALES ORDER FORM", x, y, HB, 12);
  if (totalPages > 1) d.txt("Page 1 of " + totalPages, x, y-12, HV, 8, d.greyC);
  y -= 44;
  d.txt("IB Case #", x, y, HB, 10); blank(x+55, y-1, x+LEFT_W);
  if (D.ib_case) d.txt(D.ib_case, x+60, y+1, HV, 9, d.ink);
  y -= 14; hline(y); y -= 16;
  d.txt("Hospital & Code", x, y, HB, 10);
  y -= 16; blank(x, y, x+LEFT_W);
  if (D.hospital) d.txt(D.hospital.slice(0,42), x+2, y+2, HV, 7.5, d.ink);
  y -= 16; blank(x, y, x+LEFT_W);
  if (D.hospital_code) d.txt(D.hospital_code, x+2, y+2, HV, 8, d.ink);
  y -= 10; hline(y); y -= 16;
  d.txt("Surgery Date", x, y, HB, 10); blank(x+75, y-1, x+LEFT_W);
  if (D.surgery_date) d.txt(D.surgery_date, x+80, y+1, HV, 9, d.ink);
  y -= 12; hline(y); y -= 16;

  const optRow = (label, optsText, chosen, prefixes) => {
    d.txt(label, x, y, HB, 10); d.txt(optsText, x+108, y, HB, 10);
    if (chosen && prefixes[chosen] !== undefined)
      d.check(x + 108 + HB.widthOfTextAtSize(prefixes[chosen], 10), y+1);
  };
  optRow("Surgery Side", "L __   R __", D.side, {"L":"L ", "R":"L __   R "}); y -= 16;
  optRow("Revision Surgery", "Y __   N __", D.revision, {"Y":"Y ", "N":"Y __   N "}); y -= 16;
  optRow("Revised DJO Product", "Y __   N __", D.revised_product, {"Y":"Y ", "N":"Y __   N "});
  y -= 12; hline(y); y -= 16;
  d.txt("PO NO", x, y, HB, 10); blank(x+40, y-1, x+LEFT_W);
  if (D.po) d.txt(D.po, x+45, y+1, HV, 9, d.ink);
  y -= 12; hline(y); y -= 16;
  d.txt("Surgeon Name", x, y, HB, 10); y -= 14; blank(x, y, x+LEFT_W);
  if (D.surgeon) d.txt(D.surgeon, x+2, y+2, HV, 9, d.ink);
  y -= 10; hline(y); y -= 16;
  [["Sales Rep", D.rep], ["Agency Name", D.agency], ["Site Number", D.site]].forEach(([lab, v]) => {
    d.txt(lab, x, y, HB, 10); blank(x+70, y-1, x+LEFT_W);
    if (v) d.txt(v, x+74, y+1, HV, 8, d.ink);
    y -= 15;
  });
  y -= 2; hline(y); y -= 16;
  d.txt("NOTES:", x, y, HB, 10);
  const noteLines = [];
  if (D.notes) {
    let cur = "";
    for (const w of D.notes.split(/\s+/)) {
      if ((cur + " " + w).trim().length > 42) { noteLines.push(cur.trim()); cur = w; }
      else cur += " " + w;
      if (noteLines.length >= 3) break;
    }
    if (cur.trim() && noteLines.length < 3) noteLines.push(cur.trim());
  }
  for (let k = 0; k < 3; k++) { y -= 15; blank(x, y, x+LEFT_W);
    if (noteLines[k]) d.txt(noteLines[k], x+2, y+2, HV, 8, d.ink); }
  y -= 12; hline(y); y -= 18;
  d.txt("PATIENT LABEL HERE", x, y, HB, 11); y -= 8;
  const box_h = (y - (BOT + 34)) / 2 * 0.8;
  d.rect(x, y-box_h, LEFT_W, box_h, {borderColor: d.greyC, borderWidth: 0.75, borderDashArray:[2,2]});
  let stickerImg = null;
  if (stickerPng) {
    try {
      try { stickerImg = await doc.embedPng(stickerPng); }
      catch (e) { stickerImg = await doc.embedJpg(stickerPng); }
      const sc = Math.min((LEFT_W-6)/stickerImg.width, (box_h-6)/stickerImg.height);
      pg.drawImage(stickerImg, { x: x + (LEFT_W - stickerImg.width*sc)/2, y: y - box_h + (box_h - stickerImg.height*sc)/2,
                          width: stickerImg.width*sc, height: stickerImg.height*sc });
    } catch(e) {}
  }

  // ARVIS box
  const aw = LEFT_W, ahdr = 12, lab_h = 11, opt_h = 16;
  const ah = ahdr + 2*(lab_h + opt_h);
  const ay = y - box_h - 34 - ah, ax = x;
  d.rect(ax, ay+ah-ahdr, aw, ahdr, {color: d.dark});
  d.ctr("ARVIS USAGE FEE", ax+aw/2, ay+ah-9, HB, 7.5, d.whiteC);
  d.rect(ax, ay, aw, ah, {borderColor: d.dark, borderWidth: 0.75});
  let yy2 = ay + ah - ahdr;
  [["CHARGE FEE", ["Y","N"]], ["HIP, KNEE OR SHOULDER", ["H","K","S"]]].forEach(([label, opts]) => {
    yy2 -= lab_h;
    d.rect(ax, yy2, aw, lab_h, {borderColor: d.dark, borderWidth: 0.75});
    d.txt(label, ax+3, yy2+3, HB, 7);
    yy2 -= opt_h;
    const cell = aw / (2*opts.length);
    opts.forEach((opt, k) => {
      const xx = ax + k*2*cell;
      d.rect(xx, yy2, cell, opt_h, {borderColor: d.dark, borderWidth: 0.75});
      d.rect(xx+cell, yy2, cell, opt_h, {borderColor: d.dark, borderWidth: 0.75});
      d.ctr(opt, xx+cell+cell/2, yy2+opt_h/2-3, HB, 8);
    });
  });

  // nurse signature
  const sig_y = M + 30;
  d.txt("Nurse Signature", x, sig_y, HB, 10);
  blank(x+90, sig_y-1, RIGHT_X+LABEL_W);

  // footer
  d.ctr("SEND PO's TO  –  DJOsurgicalonbase@enovis.com", W/2, M+12, HB, 11);
  d.ctr("or fax to 888-838-3668", W/2, M, HB, 9);
  drawBorder(d);

  // ============ CONTINUATION PAGES ============
  for (let p = 1; p < totalPages; p++) {
    const pg2 = doc.addPage([W, H]);
    const d2 = makeDraw(pg2);
    drawGrid(d2, HB, HV, chunks[p], p*12);
    let y2 = TOP;
    d2.txt("DJO / Enovis", M, y2-20, HB, 20); y2 -= 40;
    d2.txt("SALES ORDER FORM", M, y2, HB, 12);
    d2.txt("(continued)  Page " + (p+1) + " of " + totalPages, M, y2-12, HV, 8, d2.greyC);
    y2 -= 44;
    d2.txt("IB Case #", M, y2, HB, 10);
    d2.line(M+55, y2-1, M+LEFT_W, y2-1, 0.6, d2.dark);
    if (D.ib_case) d2.txt(D.ib_case, M+60, y2+1, HV, 9, d2.ink);
    y2 -= 22;
    d2.txt("Surgeon Name", M, y2, HB, 10); y2 -= 14;
    d2.line(M, y2, M+LEFT_W, y2, 0.6, d2.dark);
    if (D.surgeon) d2.txt(D.surgeon, M+2, y2+2, HV, 9, d2.ink);
    y2 -= 22;
    d2.txt("Surgery Date", M, y2, HB, 10);
    d2.line(M+75, y2-1, M+LEFT_W, y2-1, 0.6, d2.dark);
    if (D.surgery_date) d2.txt(D.surgery_date, M+80, y2+1, HV, 9, d2.ink);
    y2 -= 30;
    d2.txt("PATIENT LABEL HERE", M, y2, HB, 11); y2 -= 8;
    const bh2 = 70;
    d2.rect(M, y2-bh2, LEFT_W, bh2, {borderColor: d2.greyC, borderWidth: 0.75, borderDashArray:[2,2]});
    if (stickerImg) {
      try {
        const sc = Math.min((LEFT_W-6)/stickerImg.width, (bh2-6)/stickerImg.height);
        pg2.drawImage(stickerImg, { x: M + (LEFT_W - stickerImg.width*sc)/2, y: y2 - bh2 + (bh2 - stickerImg.height*sc)/2,
                            width: stickerImg.width*sc, height: stickerImg.height*sc });
      } catch(e) {}
    }
    drawBorder(d2);
  }

  return await doc.save();
}
</script>
